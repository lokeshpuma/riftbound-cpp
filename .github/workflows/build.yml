name: Build and Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-build-and-test:
    name: Native Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential \
            cmake \
            git \
            pkg-config \
            xorg-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libasound2-dev \
            libx11-dev \
            libxrandr-dev \
            libxi-dev \
            libxcursor-dev \
            libxinerama-dev \
            libxext-dev \
            libxfixes-dev \
            libxxf86vm-dev \
            libwayland-dev \
            libxkbcommon-dev

      - name: Configure CMake
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Build
        run: |
          if ! cmake --build build --config Release -j 2 2>&1 | tee build.log; then
            MSG=$(tail -n 15 build.log | tr '\n' ' ')
            echo "::error title=BuildFailure::$MSG"
            exit 1
          fi

      - name: Run Unit Tests
        run: |
          if ! ./build/riftbound_tests 2>&1 | tee test_output.log; then
            ERR=$(grep -iE "FAILED" test_output.log | tr '\n' ' | ')
            echo "::error::Unit Test Failure: $ERR"
            exit 1
          fi

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-${{ matrix.os }}
          path: build.log
