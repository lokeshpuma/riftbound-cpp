name: Build and Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-build-and-test:
    name: Native Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential \
            cmake \
            git \
            pkg-config \
            xorg-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libasound2-dev \
            libx11-dev \
            libxrandr-dev \
            libxi-dev \
            libxcursor-dev \
            libxinerama-dev \
            libxext-dev \
            libxfixes-dev \
            libxxf86vm-dev \
            libwayland-dev \
            libxkbcommon-dev

      - name: Configure CMake
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Build
        run: |
          if ! cmake --build build --config Release --target riftbound riftbound_tests -j 2 2>&1 | tee build.log; then
            ERR_MSG=$(grep -iE "error:|fatal error:" build.log | head -n 10 | tr '\n' ' | ')
            echo "::error::Build Failed: $ERR_MSG"
            echo "--- LAST 50 LINES ---"
            tail -n 50 build.log
            exit 1
          fi

      - name: Run Unit Tests
        run: |
          TEST_BIN=$(find build -type f -name "riftbound_tests" | head -n 1)
          echo "Found test binary at: $TEST_BIN"
          if [ -z "$TEST_BIN" ]; then
            echo "::error::Could not find riftbound_tests binary"
            find build -ls
            exit 1
          fi
          chmod +x "$TEST_BIN"
          if ! "$TEST_BIN" 2>&1 | tee test.log; then
            ERR_MSG=$(grep -iE "FAILED:" test.log | tr '\n' ' | ')
            echo "::error::Test Failures: $ERR_MSG"
            exit 1
          fi
