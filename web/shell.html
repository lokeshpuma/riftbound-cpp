<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Riftbound: Echoes of Ember</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #0d0b14;
            color: #e0d8f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            aspect-ratio: 16 / 9;
            width: min(100vw, calc(100vh * 16 / 9));
            height: min(100vh, calc(100vw * 9 / 16));
            max-width: 1280px;
            max-height: 720px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 20px rgba(255, 140, 20, 0.15);
            margin: auto;
        }

        canvas.emscripten {
            width: 100%;
            height: 100%;
            display: block;
            border: none;
            outline: none;
        }

        /* Loading Overlay */
        #loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #110e1b;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transition: opacity 0.5s ease-out;
        }

        .title {
            font-size: 2.4rem;
            font-weight: 800;
            color: #ffaa28;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-shadow: 0 0 15px rgba(255, 170, 40, 0.6);
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 1.1rem;
            color: #ffdf9e;
            letter-spacing: 2px;
            margin-bottom: 30px;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 170, 40, 0.2);
            border-top: 4px solid #ffaa28;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #progress-bar-container {
            width: 280px;
            height: 10px;
            background: #252033;
            border-radius: 5px;
            overflow: hidden;
            border: 1px solid #4a3e63;
        }

        #progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #ff8c1a, #ffd15c);
            transition: width 0.2s ease;
        }

        #status-text {
            margin-top: 12px;
            font-size: 0.85rem;
            color: #a89bb8;
        }

        /* Controls & Controls bar */
        #toolbar {
            position: absolute;
            bottom: 12px;
            right: 12px;
            display: flex;
            gap: 8px;
            z-index: 5;
        }

        .tool-btn {
            background: rgba(30, 25, 45, 0.8);
            border: 1px solid rgba(255, 170, 40, 0.4);
            color: #ffdf9e;
            padding: 6px 14px;
            border-radius: 4px;
            font-size: 0.8rem;
            cursor: pointer;
            backdrop-filter: blur(4px);
            transition: all 0.2s;
        }

        .tool-btn:hover {
            background: rgba(60, 50, 85, 0.9);
            border-color: #ffaa28;
            box-shadow: 0 0 10px rgba(255, 170, 40, 0.3);
        }

        #error-banner {
            display: none;
            position: absolute;
            top: 20px;
            background: rgba(180, 20, 20, 0.9);
            color: #fff;
            padding: 12px 24px;
            border-radius: 6px;
            border: 1px solid #ff6666;
            font-size: 0.9rem;
            z-index: 20;
            max-width: 80%;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="error-banner"></div>

    <div id="game-container">
        <div id="loading-overlay">
            <div class="title">RIFTBOUND</div>
            <div class="subtitle">Echoes of Ember</div>
            <div class="spinner"></div>
            <div id="progress-bar-container">
                <div id="progress-bar"></div>
            </div>
            <div id="status-text">Summoning WebAssembly core...</div>
        </div>

        <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>

        <div id="toolbar">
            <button class="tool-btn" id="btn-fullscreen" onclick="toggleFullscreen()">Fullscreen</button>
        </div>
    </div>

    <script type='text/javascript'>
        var statusElement = document.getElementById('status-text');
        var progressElement = document.getElementById('progress-bar');
        var loadingOverlay = document.getElementById('loading-overlay');
        var errorBanner = document.getElementById('error-banner');

        function showError(msg) {
            errorBanner.innerText = msg;
            errorBanner.style.display = 'block';
        }

        // Prevent browser scrolling on gaming keys
        window.addEventListener("keydown", function(e) {
            if (["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].indexOf(e.code) > -1) {
                if (document.activeElement === document.getElementById('canvas') || e.target === document.body) {
                    e.preventDefault();
                }
            }
        }, false);

        function toggleFullscreen() {
            var container = document.getElementById('game-container');
            if (!document.fullscreenElement) {
                if (container.requestFullscreen) {
                    container.requestFullscreen();
                } else if (container.webkitRequestFullscreen) {
                    container.webkitRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        var Module = {
            preRun: [],
            postRun: [function() {
                setTimeout(function() {
                    loadingOverlay.style.opacity = '0';
                    setTimeout(function() {
                        loadingOverlay.style.display = 'none';
                    }, 500);
                }, 400);
            }],
            print: function(text) {
                console.log("[Riftbound] " + text);
            },
            printErr: function(text) {
                console.error("[Riftbound] " + text);
            },
            canvas: (function() {
                var canvas = document.getElementById('canvas');
                canvas.addEventListener("webglcontextlost", function(e) {
                    showError("WebGL context lost. Please reload the webpage.");
                    e.preventDefault();
                }, false);
                return canvas;
            })(),
            setStatus: function(text) {
                if (!Module.setStatus.last) Module.setStatus.last = { time: Date.now(), text: '' };
                if (text === Module.setStatus.last.text) return;
                var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
                if (m) {
                    var progress = parseInt(m[2]) / parseInt(m[4]);
                    progressElement.style.width = (progress * 100) + '%';
                    statusElement.innerText = "Loading assets... (" + Math.round(progress * 100) + "%)";
                } else {
                    statusElement.innerText = text;
                }
            },
            totalDependencies: 0,
            monitorRunDependencies: function(left) {
                this.totalDependencies = Math.max(this.totalDependencies, left);
                Module.setStatus(left ? 'Preparing assets (' + (this.totalDependencies-left) + '/' + this.totalDependencies + ')...' : 'All downloads complete.');
            },
            onAbort: function(what) {
                showError("WebAssembly execution aborted: " + what);
            }
        };

        window.onerror = function(event) {
            showError("WebAssembly runtime error encountered. Please check browser console.");
        };
    </script>
    {{{ SCRIPT }}}
</body>
</html>
